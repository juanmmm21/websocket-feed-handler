[package]
name = "websocket-feed-handler-rs"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Optional Rust accelerator for websocket-feed-handler (Binance message parsing)."
publish = false

[lib]
name = "websocket_feed_handler_rs"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["abi3-py311"] }
serde_json = "1"

[features]
# maturin enables this when building the wheel; `cargo test` links against libpython instead
extension-module = ["pyo3/extension-module"]

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
