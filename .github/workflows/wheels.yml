name: wheels

# Wheels of the optional Rust accelerator (rust/) for Linux x86_64 and macOS arm64.
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }} ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: macos-14
            target: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: rust
          target: ${{ matrix.target }}
          manylinux: auto
          args: --release --out dist
      - name: smoke test the wheel against the Python fallback
        run: |
          pip install -e ".[dev]"
          pip install rust/dist/*.whl
          python -c "import websocket_feed_handler.fast as f; assert f.BACKEND == 'rust'"
          pytest -q tests/test_fast_parity.py
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: rust/dist/*.whl
