[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "websocket-feed-handler"
version = "0.2.0"
description = "Cliente WebSocket de alta velocidad con reconexión automática para feeds de exchanges."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "juanmmm21" }]
keywords = ["websocket", "trading", "binance", "coinbase", "market-data"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Typing :: Typed",
]
dependencies = [
    "websockets>=12.0,<16",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.8",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
websocket-feed-handler = "websocket_feed_handler.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/websocket_feed_handler"]

[tool.hatch.build.targets.sdist]
include = ["src/websocket_feed_handler", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
